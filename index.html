<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Веб-плакат Chik</title>
<link rel="icon" href="../chik/favicons/fav.svg" sizes="any">
  <link rel="stylesheet" href="stylesheets/style.css" />
</head>

<body>
  <section class="stroke">
    <!-- MARQUEE -->
    <div class="marquee">
      <div class="marquee__track">
        <span>МУЗЫКАЛЬНАЯ ПЛАТФОРМА ДЛЯ ПТИЦ</span>
        <span>МУЗЫКАЛЬНАЯ ПЛАТФОРМА ДЛЯ ПТИЦ</span>
        <span>МУЗЫКАЛЬНАЯ ПЛАТФОРМА ДЛЯ ПТИЦ</span>

        <span aria-hidden="true">МУЗЫКАЛЬНАЯ ПЛАТФОРМА ДЛЯ ПТИЦ</span>
        <span aria-hidden="true">МУЗЫКАЛЬНАЯ ПЛАТФОРМА ДЛЯ ПТИЦ</span>

      </div>
    </div>
</section>
<!-- ПЕРВЫЙ ЭКРАН -->
<section class="screen-1">
  <!-- левая сторона -->
<div class="left-1">

<div class="left-top-1">
  <div class="left-top-circle-1">
  <div class="circle-wrap">
    <img class="circle-1" src="../chik/images/circle-lime.svg" alt="кружки">
  </div>
  <div class="circle-wrap">
    <img class="circle-2" src="../chik/images/circle-black.svg" alt="кружки">
  </div>
  <div class="circle-wrap">
    <img class="circle-3" src="../chik/images/circle-lime.svg" alt="кружки">
  </div>
  <div class="circle-wrap">
    <img class="circle-4" src="../chik/images/circle-black.svg" alt="кружки">
  </div>
  <div class="circle-wrap">
    <img class="circle-5" src="../chik/images/circle-lime.svg" alt="кружки">
  </div>
  <div class="circle-wrap">
    <img class="circle-6" src="../chik/images/circle-black.svg" alt="кружки">
  </div>
</div>
  <div class="left-top-note-1">
    <div class="note-1">
      <img class="note-group-1" src="../chik/images/note-group-1.svg" alt="нотки">
    </div>

    <div class="note-2">
      <img class="note-group-2" src="../chik/images/note-group-2.svg" alt="нотки">
    </div>
  </div>
</div>

  <div class="left-center-1">
  <div class="rectangle"></div>
  <img class="logo-1" src="../chik/images/logo-1.svg" alt="логотип">
</div>


<div class="left-bottom-1">
  <div class="left-bottom-lines-1">
    <img src="../chik/images/lines-1.svg" alt="линии">
  </div>
   <div class="microphone-1">
  <div class="microphone-track">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">

    <!-- дубликат -->
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
    <img src="../chik/images/microphone.svg" alt="">
  </div>
</div>

</div>

</div>
 <!-- правая сторона -->
<div class="right-1">
  <img class="star" src="../chik/images/big-star-1.svg" alt="большая-звезда-позади-попугая">
  <img class="parrot" src="../chik/images/parrot.svg" alt="попугай">
  <!-- sparkles / x-stars -->
  <img class="sparkle star1" src="../chik/images/star-1.svg" alt="маленькая-звезда-1">
  <img class="sparkle star2" src="../chik/images/star-2.svg" alt="маленькая-звезда-2">
  <img class="sparkle star3" src="" alt="маленькая-звезда-3">
  <img class="sparkle star4" src="" alt="маленькая-звезда-4">
  <img class="sparkle star5" src="" alt="маленькая-звезда-5">
  <img class="sparkle star6" src="" alt="маленькая-звезда-6">
  <img class="sparkle star7" src="" alt="маленькая-звезда-7">
  <img class="sparkle star8" src="" alt="маленькая-звезда-8">
  
</div>

</html>
